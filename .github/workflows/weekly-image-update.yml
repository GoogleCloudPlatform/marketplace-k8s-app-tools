name: Weekly Kubectl Image Update PR

on:
  schedule:
    # Runs at 11:00 UTC every Monday
    - cron: '0 11 * * 1'
  workflow_dispatch: # Allows manual triggering

jobs:
  create_update_pr:
    runs-on: ubuntu-latest
    # Scheduled and manual runs force-push the same branch; don't overlap them.
    concurrency:
      group: weekly-image-update
      cancel-in-progress: false
    permissions:
      # GITHUB_TOKEN is only used to approve the PR. Git and other gh calls
      # use PRODUCER_SAAP_BOT_PAT.
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PRODUCER_SAAP_BOT_PAT }}

      - name: Set up Git
        run: |
          # Configure Git to use the official GitHub Actions bot name and email for proper attribution in the GitHub UI
          git config --global user.name 'ccm-producer-saap-gh-bot'
          git config --global user.email 'ccm-producer-saap-github-bot@google.com'

      - name: Calculate Dates
        id: dates
        run: |
          # Use ISO 8601 format
          echo "LOG_ENTRY=- $(date +'%Y-%m-%d %H:%M') UTC: Automated weekly rebuild trigger" >> $GITHUB_OUTPUT

      - name: Prepare Branch
        id: branch
        run: |
          # Use a static branch name to prevent branch clutter and duplicate PRs
          # from weekly runs. Force-pushing to this branch will update the open PR.
          BRANCH_NAME="automated/kubectl-image-update"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          
          # Checkout branch, creating it if it doesn't exist or resetting it if it does
          git checkout -B "$BRANCH_NAME"
          # Reset to origin/master to ensure we base changes on latest master
          git reset --hard origin/master

      - name: Update Changelog File
        env:
          LOG_ENTRY: ${{ steps.dates.outputs.LOG_ENTRY }}
        run: |
          # Append to AUTOBUILD_CHANGELOG.md (creates it if it does not exist)
          echo "$LOG_ENTRY" >> AUTOBUILD_CHANGELOG.md
          echo "AUTOBUILD_CHANGELOG.md updated."

      - name: Commit changes
        env:
          LOG_ENTRY: ${{ steps.dates.outputs.LOG_ENTRY }}
        run: |
          git add AUTOBUILD_CHANGELOG.md
          git commit -m "Automated weekly image rebuild trigger: $LOG_ENTRY"

      - name: Push Branch
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.BRANCH_NAME }}
        run: |
          # Force push is required since we reset the branch to origin/master
          git push -f origin "$BRANCH_NAME"

      - name: Create or Locate Pull Request
        id: create_pr
        env:
          GITHUB_TOKEN: ${{ secrets.PRODUCER_SAAP_BOT_PAT }}
          BRANCH_NAME: ${{ steps.branch.outputs.BRANCH_NAME }}
        run: |
          # Check if PR already exists to avoid creating duplicates
          PR_URL=$(gh pr list --head "$BRANCH_NAME" --state open --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            PR_TITLE="Weekly Kubectl Image Rebuild"
            PR_URL=$(gh pr create \
              --title "$PR_TITLE" \
              --body "Automated PR to trigger weekly kubectl image rebuild. Merging this PR will release updated images." \
              --head "$BRANCH_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --reviewer "GoogleCloudPlatform/ccm-saap-team")
            echo "Created PR: $PR_URL"
          else
            echo "PR already exists: $PR_URL. Updated branch will trigger new builds."
          fi
          echo "PR_URL=$PR_URL" >> $GITHUB_OUTPUT

      - name: Comment /gcbrun on PR
        if: steps.create_pr.outputs.PR_URL != ''
        env:
          GITHUB_TOKEN: ${{ secrets.PRODUCER_SAAP_BOT_PAT }}
          PR_URL: ${{ steps.create_pr.outputs.PR_URL }}
        run: |
          gh pr comment "$PR_URL" --body "/gcbrun"

      - name: Approve and enable auto-merge
        if: steps.create_pr.outputs.PR_URL != '' && steps.branch.outputs.BRANCH_NAME == 'automated/kubectl-image-update'
        env:
          # Merge with the bot PAT so the merge push to master triggers
          # create-weekly-image-update-release.yml (pushes made with
          # GITHUB_TOKEN don't trigger workflows).
          GITHUB_TOKEN: ${{ secrets.PRODUCER_SAAP_BOT_PAT }}
          # Approve as github-actions[bot]: the PR author (the PAT's account)
          # can't approve its own PR.
          APPROVE_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.create_pr.outputs.PR_URL }}
        run: |
          # Only approve and auto-merge the commit pushed above, and only if
          # it's the bot's changelog-only PR into master.
          HEAD_SHA=$(git rev-parse HEAD)

          # An existing PR's head updates asynchronously after a force-push.
          for attempt in 1 2 3 4 5 6; do
            PR_INFO=$(gh pr view "$PR_URL" \
              --json number,headRefName,baseRefName,headRefOid,isCrossRepository,author \
              --jq '[.number, .headRefName, .baseRefName, .headRefOid, (.isCrossRepository | tostring), .author.login] | @tsv')
            IFS=$'\t' read -r PR_NUMBER HEAD_REF BASE_REF PR_HEAD_SHA CROSS_REPO AUTHOR <<< "$PR_INFO"
            [ "$PR_HEAD_SHA" = "$HEAD_SHA" ] && break
            echo "Attempt $attempt: PR head is $PR_HEAD_SHA, waiting for $HEAD_SHA"
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          if [ "$CROSS_REPO" != "false" ] || [ "$HEAD_REF" != "automated/kubectl-image-update" ] \
              || [ "$BASE_REF" != "master" ] || [ "$AUTHOR" != "ccm-producer-saap-gh-bot" ] \
              || [ "$PR_HEAD_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Not auto-merging PR #$PR_NUMBER: head=$HEAD_REF base=$BASE_REF author=$AUTHOR" \
              "cross_repo=$CROSS_REPO sha=$PR_HEAD_SHA (expected $HEAD_SHA)"
            exit 1
          fi

          # Files HEAD_SHA changes relative to its merge base with master,
          # including the old name of renamed files.
          FILES=$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$HEAD_SHA" \
            --jq '[.files[] | .filename, (.previous_filename // empty)] | unique | join(",")')
          if [ "$FILES" != "AUTOBUILD_CHANGELOG.md" ]; then
            echo "::error::Not auto-merging PR #$PR_NUMBER: unexpected changed files: $FILES"
            exit 1
          fi

          # Approve exactly the commit that was checked above.
          GH_TOKEN="$APPROVE_TOKEN" gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            -f event=APPROVE -f commit_id="$HEAD_SHA" \
            -f body="Auto-approved: weekly rebuild trigger that only changes AUTOBUILD_CHANGELOG.md." \
            --silent

          # Fail loudly if the approval doesn't satisfy master's review rules
          # (for example, if CODEOWNERS changes), instead of leaving auto-merge
          # stuck.
          for attempt in 1 2 3; do
            DECISION=$(gh pr view "$PR_URL" --json reviewDecision --jq .reviewDecision)
            [ "$DECISION" = "APPROVED" ] && break
            echo "Attempt $attempt: reviewDecision is $DECISION"
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          if [ "$DECISION" != "APPROVED" ]; then
            echo "::error::bot approval did not satisfy required reviews"
            exit 1
          fi

          # Merges once master's required status checks pass (or right away if
          # they already have). Retry in case the PR becomes mergeable mid-call.
          for attempt in 1 2 3; do
            gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA" && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "::error::could not enable auto-merge for PR #$PR_NUMBER"
          exit 1
