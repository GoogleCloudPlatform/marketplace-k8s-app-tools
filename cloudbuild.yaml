# This cloudbuild.yaml config file is triggered in two contexts:
#
#
# Trigger #1: Before master merge
#
# GoogleCloudPlatform/marketplace-k8s-app-tools push to any branch
# https://console.cloud.google.com/cloud-build/triggers?project=marketplace-k8s-app-tools
#
# This build trigger asserts the invariant that the source code can
# be built and pushed into a repository. Its success blocks pull
# request. gcr.io/marketplace-k8s-app-tools read access restricted.
#
#
# Trigger #2: After master merge
#
# GoogleCloudPlatform/marketplace-k8s-app-tools push to master branch
# https://console.cloud.google.com/cloud-build/triggers?project=cloud-marketplace-tools
#
# This build trigger asserts the invariant that each commit on the master
# branch of GoogleCloudPlatform/marketplace-k8s-app-tools will be built
# and tagged in gcr.io/cloud-marketplace-tools/k8s.

# The following variables will be provided by Cloud Build.
#
# $PROJECT_ID: build.ProjectId
# $BUILD_ID: build.BuildId
# $COMMIT_SHA: build.SourceProvenance.ResolvedRepoSource.Revision.CommitSha
# $SHORT_SHA : The first seven characters of COMMIT_SHA
# $REPO_NAME: build.Source.RepoSource.RepoName (only available for triggered builds)
# $BRANCH_NAME: build.Source.RepoSource.Revision.BranchName (only available for triggered builds)
# $TAG_NAME: build.Source.RepoSource.Revision.TagName (only available for triggered builds)
# $REVISION_ID: build.SourceProvenance.ResolvedRepoSource.Revision.CommitSha (only available for triggered builds)
#
# Source: https://cloud.google.com/cloud-build/docs/configuring-builds/substitute-variable-values
timeout: 1200s # 20m
options:
  machineType: 'N1_HIGHCPU_8'

substitutions:
  # Preferred location of the ephemeral integration test cluster. A zone (for
  # example 'us-central1-c') is strongly preferred over a region: passing a
  # region creates a *regional* cluster with _CLUSTER_NUM_NODES nodes in each
  # of its zones. If a region is passed, its zones are tried one at a time.
  _CLUSTER_LOCATION: 'us-central1-c'
  # Locations tried, in order, when the cluster cannot be created in
  # _CLUSTER_LOCATION, for example because of a transient GCE_STOCKOUT or
  # because the regional CPU quota is exhausted by concurrent builds.
  _CLUSTER_LOCATION_FALLBACKS: 'us-central1-f us-central1-b us-east1-c us-west1-b'
  # Size of the test cluster. tests/integration runs 4 small deployments, so a
  # handful of nodes in a single zone is enough. Bump these if the integration
  # tests start failing to schedule.
  _CLUSTER_NUM_NODES: '3'
  _CLUSTER_MACHINE_TYPE: 'e2-standard-2'

steps:

- id: &BuildDev Build dev
  name: gcr.io/cloud-builders/docker
  waitFor:
  - '-'
  args:
  - build
  - --tag
  - gcr.io/$PROJECT_ID/k8s/dev:sha_$COMMIT_SHA
  - --tag
  - gcr.io/$PROJECT_ID/k8s/dev:sha_$SHORT_SHA
  - --file
  - marketplace/dev/Dockerfile
  - .

- id: &BuildEnvsubst Build deployer_envsubst
  name: gcr.io/cloud-builders/docker
  waitFor:
  - '-'
  args:
  - build
  - --tag
  - gcr.io/$PROJECT_ID/k8s/deployer_envsubst:sha_$COMMIT_SHA
  - --tag
  - gcr.io/$PROJECT_ID/k8s/deployer_envsubst:sha_$SHORT_SHA
  - --file
  - marketplace/deployer_envsubst_base/Dockerfile
  - .

- id: &BuildEnvsubstOnBuild Build deployer_envsubst onbuild
  name: gcr.io/cloud-builders/docker
  waitFor:
  - *BuildEnvsubst
  args:
  - build
  - --build-arg
  - FROM=gcr.io/$PROJECT_ID/k8s/deployer_envsubst:sha_$COMMIT_SHA
  - --tag
  - gcr.io/$PROJECT_ID/k8s/deployer_envsubst/onbuild:sha_$COMMIT_SHA
  - --tag
  - gcr.io/$PROJECT_ID/k8s/deployer_envsubst/onbuild:sha_$SHORT_SHA
  - --file
  - marketplace/deployer_envsubst_base/onbuild/Dockerfile
  - .

- id: &BuildHelm Build deployer_helm
  name: gcr.io/cloud-builders/docker
  waitFor:
  - '-'
  args:
  - build
  - --tag
  - gcr.io/$PROJECT_ID/k8s/deployer_helm:sha_$COMMIT_SHA
  - --tag
  - gcr.io/$PROJECT_ID/k8s/deployer_helm:sha_$SHORT_SHA
  - --file
  - marketplace/deployer_helm_base/Dockerfile
  - .

- id: &BuildHelmOnbuild Build deployer_helm onbuild
  name: gcr.io/cloud-builders/docker
  waitFor:
  - *BuildHelm
  args:
  - build
  - --build-arg
  - FROM=gcr.io/$PROJECT_ID/k8s/deployer_helm:sha_$COMMIT_SHA
  - --tag
  - gcr.io/$PROJECT_ID/k8s/deployer_helm/onbuild:sha_$COMMIT_SHA
  - --tag
  - gcr.io/$PROJECT_ID/k8s/deployer_helm/onbuild:sha_$SHORT_SHA
  - --file
  - marketplace/deployer_helm_base/onbuild/Dockerfile
  - .

- id: &BuildMarketplaceIntegrationChart Build marketplace-integration Chart
  name: gcr.io/$PROJECT_ID/k8s/dev:sha_$COMMIT_SHA
  waitFor:
  - *BuildDev
  entrypoint: bash
  args:
  - -exc
  - |
    mkdir charts-tgz/
    helm package marketplace/charts/marketplace-integration/ \
        --version "0.0.0+sha.$COMMIT_SHA" \
        --destination charts-tgz/

    gcloud storage cp gs://$PROJECT_ID-charts/index.yaml index.yaml
    helm repo index --merge index.yaml charts-tgz/

- id: &InitializeCredentials Initialize Credentials
  name: gcr.io/cloud-builders/gcloud
  waitFor:
  - '-'
  entrypoint: bash
  args:
  - -exc
  - |
    # Use the 'c-$BUILD_ID' as the cluster name as it must start with a letter,
    # and have a max length of 40 chars (BUILD_ID is 37). Then install App CRD.
    CLUSTER_NAME='c-$BUILD_ID'

    # Build the ordered list of zones to try. Cluster creation is atomic and
    # regularly fails with transient, location specific errors: GCE_STOCKOUT
    # when Compute Engine is out of capacity for the machine type in a zone, or
    # GCE_QUOTA_EXCEEDED when concurrent builds hold the regional CPU quota.
    # Retrying elsewhere is much cheaper than failing the whole build.
    ZONES=()
    for location in ${_CLUSTER_LOCATION} ${_CLUSTER_LOCATION_FALLBACKS}; do
      if [[ "$$location" == *-[a-z] ]]; then
        ZONES+=("$$location")
      else
        # A region was given. Expand it so that zonal clusters are created: a
        # regional cluster needs capacity in every zone of the region at once.
        ZONES+=($$(gcloud compute zones list --project '$PROJECT_ID' \
            --filter="region:( $$location ) AND status=UP" \
            --format='value(name)' || echo "$$location"))
      fi
    done

    CLUSTER_ZONE=''
    for zone in "$${ZONES[@]}"; do
      echo "Creating cluster $$CLUSTER_NAME in $$zone ..."
      if gcloud container clusters create "$$CLUSTER_NAME" \
          --zone "$$zone" \
          --project '$PROJECT_ID' \
          --num-nodes '${_CLUSTER_NUM_NODES}' \
          --machine-type '${_CLUSTER_MACHINE_TYPE}' \
          --labels=creation-timestamp=`date +%s`; then
        CLUSTER_ZONE="$$zone"
        break
      fi
      # A failed creation leaves the cluster behind in ERROR state, where it
      # keeps consuming CPU quota until it is deleted.
      echo "Cluster creation failed in $$zone, trying the next zone."
      gcloud container clusters delete "$$CLUSTER_NAME" --zone "$$zone" \
          --project '$PROJECT_ID' --quiet || true
    done

    if [[ -z "$$CLUSTER_ZONE" ]]; then
      echo "Failed to create a test cluster in any of: $${ZONES[*]}"
      exit 1
    fi

    # The Cleanup step must delete the cluster from the zone it ended up in.
    echo -n "$$CLUSTER_ZONE" > /workspace/cluster_zone

    gcloud container clusters get-credentials "$$CLUSTER_NAME" --zone "$$CLUSTER_ZONE" --project '$PROJECT_ID'
    kubectl apply -f "https://raw.githubusercontent.com/GoogleCloudPlatform/marketplace-k8s-app-tools/$COMMIT_SHA/crd/app-crd.yaml"
    mkdir -p /workspace/.kube/
    cp -r $$HOME/.kube/ /workspace/
    mkdir -p /workspace/.config/gcloud/
    cp -r $$HOME/.config/gcloud/ /workspace/.config/

- id: &Verify Verify
  name: gcr.io/$PROJECT_ID/k8s/dev:sha_$COMMIT_SHA
  waitFor:
  - *InitializeCredentials
  - *BuildDev
  - *BuildEnvsubst
  - *BuildEnvsubstOnBuild
  - *BuildHelm
  - *BuildHelmOnbuild
  env:
  - 'KUBE_CONFIG=/workspace/.kube'
  - 'GCLOUD_CONFIG=/workspace/.config/gcloud'
  - 'VERIFICATION_LOGS_PATH=/workspace/.mpdev_logs'
  # Use local Docker network named cloudbuild as described here:
  # https://cloud.google.com/cloud-build/docs/overview#build_configuration_and_build_steps
  - 'DOCKER_NETWORK=cloudbuild'
  - MARKETPLACE_TOOLS_TAG=testing-sha_$COMMIT_SHA
  - 'DOCKER_API_VERSION=1.41'
  # The image entrypoint (docker_entrypoint.sh) sets up the kubectl and gcloud
  # configs before exec'ing these args, so the test command must be run through
  # it rather than through a custom step entrypoint.
  args:
  - bash
  - -c
  - |
    # Record the result rather than failing the step, so that the Cleanup step
    # below always runs and the test cluster is never leaked. The recorded
    # result becomes the build status in 'Report verification result'.
    make -j10 --output-sync tests/integration
    echo "$$?" > /workspace/verify_exit_code
  # Belt and braces: even if the step dies without recording a result, Cleanup
  # must still run. The missing result is then reported as a failure.
  allowFailure: true

- id: &Cleanup Cleanup
  name: gcr.io/cloud-builders/gcloud
  waitFor:
  - *Verify
  entrypoint: bash
  args:
  - -exc
  - |
    CLUSTER_ZONE="$$(cat /workspace/cluster_zone)"
    # Cleanup must not mask the verification result, so it never fails the
    # build. A cluster that could not be deleted is called out loudly instead.
    gcloud container clusters delete 'c-$BUILD_ID' --zone "$$CLUSTER_ZONE" --project '$PROJECT_ID' --quiet \
      || echo "WARNING: could not delete cluster c-$BUILD_ID in $$CLUSTER_ZONE. It must be deleted manually."

- id: Report verification result
  name: gcr.io/cloud-builders/gcloud
  waitFor:
  - *Cleanup
  entrypoint: bash
  args:
  - -c
  - |
    EXIT_CODE="$$(cat /workspace/verify_exit_code 2>/dev/null || echo 1)"
    if [[ "$$EXIT_CODE" != '0' ]]; then
      echo "Verification failed with exit code $$EXIT_CODE. See the 'Verify' step above."
    fi
    exit "$$EXIT_CODE"

images:
  - gcr.io/$PROJECT_ID/k8s/dev:sha_$COMMIT_SHA
  - gcr.io/$PROJECT_ID/k8s/dev:sha_$SHORT_SHA
  - gcr.io/$PROJECT_ID/k8s/deployer_envsubst:sha_$COMMIT_SHA
  - gcr.io/$PROJECT_ID/k8s/deployer_envsubst:sha_$SHORT_SHA
  - gcr.io/$PROJECT_ID/k8s/deployer_envsubst/onbuild:sha_$COMMIT_SHA
  - gcr.io/$PROJECT_ID/k8s/deployer_envsubst/onbuild:sha_$SHORT_SHA
  - gcr.io/$PROJECT_ID/k8s/deployer_helm:sha_$COMMIT_SHA
  - gcr.io/$PROJECT_ID/k8s/deployer_helm:sha_$SHORT_SHA
  - gcr.io/$PROJECT_ID/k8s/deployer_helm/onbuild:sha_$COMMIT_SHA
  - gcr.io/$PROJECT_ID/k8s/deployer_helm/onbuild:sha_$SHORT_SHA

artifacts:
  objects:
    location: gs://$PROJECT_ID-charts/
    paths:
    - charts-tgz/*
